schema_version = "field-policy-0.1.0"

# Reviewed real-source policy:
# - translate natural-language tool and parameter descriptions;
# - preserve every tool-call argument byte-for-byte unless an exact named
#   argument path receives a separate reviewed translation policy.
policy_version = "field-policy-real-source-0.2.0"
tool_description_action = "translate"
parameter_description_action = "translate"

[[argument_policies]]
tool_name = "*"
argument_pointer = "/*"
action = "copy_exact"
